name: Update TrollStore source

on:
  schedule:
    # GitHub Actions 使用 UTC；北京时间每天 08:20 执行。
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trollstore-source
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/apps.json
        run: python3 scripts/update_source.py

      - name: Validate source
        run: python3 -m json.tool apps.json > /dev/null

      - name: Commit changes
        run: |
          if git diff --quiet -- apps.json; then
            echo "No updates found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "chore(source): 自动更新应用版本"
          git push
